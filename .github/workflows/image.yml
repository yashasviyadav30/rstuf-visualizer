name: Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # The version pyproject.toml declares. Generating a test repository below
      # installs from uv.lock with --locked, which refuses to run on any
      # other version rather than resolving something the lock never pinned.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      # Built with plain docker rather than a marketplace action, so the
      # command here is the same one a developer runs and there is one less
      # third-party action to trust.
      - name: Build
        run: docker build -t rstuf-visualizer:ci .

      # A published image nobody has run is a liability. This starts it
      # against a generated repository and checks it verifies the chain.
      - name: Check it runs
        run: |
          python -m pip install --no-cache-dir uv
          (cd backend && uv sync --locked --no-dev && uv run python scripts/gen_fixture.py)

          docker network create ci-net
          docker run -d --name metadata --network ci-net \
            -v "$PWD/backend/fixtures/good:/srv/metadata:ro" \
            python:3.13-slim python -m http.server -d /srv/metadata 8080

          docker run -d --name visualizer --network ci-net -p 8000:8000 \
            --read-only --tmpfs /tmp \
            -e RSTUF_METADATA_URL=http://metadata:8080/ \
            -e RSTUF_TRUSTED_ROOT="$(base64 -w0 backend/fixtures/good/root.json)" \
            rstuf-visualizer:ci

          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8000/healthz > /dev/null && break
            sleep 1
          done

          curl -sf http://127.0.0.1:8000/api/v1/overview | tee /dev/stderr \
            | grep -q '"status":"valid"'
          curl -sf http://127.0.0.1:8000/api/v1/roots | tee /dev/stderr \
            | grep -q '"current":3'
          test "$(docker exec visualizer id -u)" = "1001"

      - name: Show the logs, when it did not work
        if: failure()
        run: docker logs visualizer || true

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/${{ github.repository }}
          tag=${GITHUB_REF#refs/tags/v}
          docker tag rstuf-visualizer:ci "$image:$tag"
          docker tag rstuf-visualizer:ci "$image:latest"
          docker push "$image:$tag"
          docker push "$image:latest"
