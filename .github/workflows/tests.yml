name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      # --deploy fails when Pipfile.lock has drifted from Pipfile, so a
      # dependency added without relocking is caught here rather than in a
      # build that quietly resolves something else.
      - name: Install dependencies
        run: |
          pip install --no-cache-dir pipenv
          pipenv install --dev --deploy --system

      - name: Lint
        run: |
          flake8 app tests scripts
          black -l79 --check --diff app tests scripts
          isort -l79 --profile black --check --diff app tests scripts
          bandit -q -r app

      # The test repositories are generated rather than committed, because
      # they carry short-lived expiry dates. conftest builds them when they
      # are missing, so nothing extra is needed here.
      - name: Test
        run: pytest -q

  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` fails when package-lock.json has drifted from package.json,
      # the same guarantee `pipenv install --deploy` gives the backend.
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      # `npm run build` type-checks before it bundles, so a component reading
      # a field the backend no longer sends fails here.
      - name: Build
        run: npm run build

  # Everything above can pass while the screen stays blank, so this opens the
  # compiled interface in a real browser against a real repository. It needs
  # both halves built, which is why it is a job of its own.
  browser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --no-cache-dir pipenv
          pipenv install --dev --deploy --system
          playwright install --with-deps chromium

      - name: Test
        working-directory: backend
        run: pytest -q tests/e2e
