name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      # --locked fails when uv.lock has drifted from pyproject.toml, so a
      # dependency added without relocking is caught here rather than in a
      # build that quietly resolves something else.
      - name: Install dependencies
        run: |
          pip install --no-cache-dir uv
          uv sync --locked

      - name: Lint
        run: |
          uv run flake8 app tests scripts
          uv run black --check --diff app tests scripts
          uv run isort --check --diff app tests scripts
          uv run bandit -q -r app

      # The test repositories are generated rather than committed, because
      # they carry short-lived expiry dates. conftest builds them when they
      # are missing, so nothing extra is needed here.
      - name: Test
        run: uv run pytest -q

  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` fails when package-lock.json has drifted from package.json,
      # the same guarantee `uv sync --locked` gives the backend.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # `npm run build` type-checks before it bundles, so a component reading
      # a field the backend no longer sends fails here.
      - name: Build
        run: npm run build

  # Everything above can pass while the screen stays blank, so this opens the
  # compiled interface in a real browser against a real repository. It needs
  # both halves built, which is why it is a job of its own.
  browser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --no-cache-dir uv
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Test
        working-directory: backend
        run: uv run pytest -q tests/e2e
