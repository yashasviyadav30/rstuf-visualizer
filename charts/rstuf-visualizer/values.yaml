# Default values for rstuf-visualizer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/repository-service-tuf/rstuf-visualizer
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- what this deployment reads ---------------------------------------------

# Base URL of the signed TUF metadata. Required.
#
# RSTUF writes metadata to storage, and object storage is not an address a TUF
# client can read. Point this at the web server standing in front of it. In
# the demo deployment, metadata goes to the S3 bucket in LocalStack and
# nothing publishes it over HTTP, so that server has to be added.
metadataUrl: ""

# Base URL of the RSTUF API. Optional.
#
# Used for the repository status panel, and as a fallback source for the
# trust anchor. Left empty, the status panel is hidden and the metadata is
# still read and verified, because none of it comes from here.
apiUrl: "http://rstuf-api"

# The one root every other file is checked against.
#
# Taking it from the API is weaker than an operator supplying it, because it
# then arrives from the same deployment being checked. Set it here for any
# install that matters.
trustedRoot:
  # Base64 root metadata, or a base64 URL pointing at it. Stored in a Secret.
  value: ""
  # Use a Secret you manage instead. Takes precedence over the value above.
  existingSecret: ""
  key: trusted-root

# How long a verified view stays reusable before the repository is read again.
cacheTtlSeconds: 30

# Ceiling on any single request this service makes upstream.
requestTimeoutSeconds: 10

# --- kubernetes -------------------------------------------------------------

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# This service reads a repository and writes nothing back to it. The only
# directory it writes at all is the trust directory, which the volume below
# provides, so the root filesystem can stay read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

# The port the container listens on. Separate from the service port because
# the process runs unprivileged and cannot bind a low one.
containerPort: 8000

## Add additional annotations to every resource
extraAnnotations: {}

ingress:
  enabled: false
  className: ""
  ingressClassName: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Both probes ask whether the process is alive, not whether the repository is
# healthy. A repository in trouble is what this service exists to show, so
# reporting it must not take the pod down.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Where the TUF client keeps the metadata it has verified. Each replica keeps
# its own copy, and losing it costs one verification pass, so this holds no
# state worth persisting.
trustDir:
  sizeLimit: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
