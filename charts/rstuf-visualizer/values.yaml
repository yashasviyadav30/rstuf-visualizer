# Default values for rstuf-visualizer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Where the image lives once this chart is published by the RSTUF
# organisation. Nothing is published there yet, so an install before that
# happens needs this pointed at wherever the image was actually built; the
# chart's own CI overrides it for exactly that reason.
image:
  repository: ghcr.io/repository-service-tuf/rstuf-visualizer
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Containers that must finish before this one starts. The service survives an
# unreachable repository by design, reporting it on screen instead of
# failing, so nothing here is required. It is useful in a deployment that
# brings its storage up alongside this, where waiting saves a first page load
# that has nothing to show.
initContainers: []
# - name: wait-for-storage
#   image: busybox:1.37
#   command: ['sh', '-c', 'until nc -z storage 4566; do sleep 2; done;']

# --- what this deployment reads ---------------------------------------------

# Base URL of the signed TUF metadata. Required, with no default: where the
# metadata is published differs with every deployment, and a guess would let
# this chart install cleanly while pointing at nothing.
#
# The worker writes each object with a public-read ACL by default, under the
# filenames a TUF client asks for, so an object store usually answers for
# them directly. In the rstuf-demo deployment that is:
#
#   http://rstuf-localstack.rstuf.svc.cluster.local:4566/tuf-metadata/
#
# Where the bucket is not readable without credentials, on real S3 with Block
# Public Access turned on for instance, point this at the web server or
# proxy standing in front of it instead. RSTUF's docker-compose deployment
# publishes its storage that way, on port 8080.
metadataUrl: ""

# Base URL of the RSTUF API. Optional.
#
# Used for the repository status panel, and as a fallback source for the
# trust anchor. Left empty, the status panel is hidden and the metadata is
# still read and verified, because none of it comes from here.
apiUrl: "http://rstuf-api"

# The one root every other file is checked against.
#
# Taking it from the API is weaker than an operator supplying it, because it
# then arrives from the same deployment being checked. Set it here for any
# install that matters.
trustedRoot:
  # Base64 root metadata, or a base64 URL pointing at it. Stored in a Secret.
  value: ""
  # Use a Secret you manage instead. Takes precedence over the value above.
  existingSecret: ""
  key: trusted-root

# Origins allowed to call the API from a browser.
#
# Empty is right for this chart: the interface is served by the same process
# as the API, so a browser asks one origin for both and needs no permission
# to do it. This exists for a deployment that serves the interface from
# somewhere else, and for a frontend development server, which answers on a
# port of its own and is therefore another site.
#
# No credentials are ever allowed across origins. Every route is a GET and
# none reads a cookie.
corsOrigins: []
# - https://visualizer.example.org

# How long a verified view stays reusable before the repository is read again.
cacheTtlSeconds: 30

# Ceiling on any single request this service makes upstream.
requestTimeoutSeconds: 10

# --- kubernetes -------------------------------------------------------------

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# This service reads a repository and writes nothing back to it. The only
# directory it writes at all is the trust directory, which the volume below
# provides, so the root filesystem can stay read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

# The port the container listens on. Separate from the service port because
# the process runs unprivileged and cannot bind a low one.
containerPort: 8000

## Add additional annotations to every resource
extraAnnotations: {}

ingress:
  enabled: false
  # The controller to use. Rendered as the ingress's ingressClassName.
  ingressClassName: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Both probes ask whether the process is alive, not whether the repository is
# healthy. A repository in trouble is what this service exists to show, so
# reporting it must not take the pod down.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Where the TUF client keeps the metadata it has verified. Each replica keeps
# its own copy, and losing it costs one verification pass, so this holds no
# state worth persisting.
trustDir:
  sizeLimit: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
