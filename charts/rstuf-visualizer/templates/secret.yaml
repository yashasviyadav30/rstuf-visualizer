{{- if and .Values.trustedRoot.value (not .Values.trustedRoot.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rstuf-visualizer.trustedRootSecret" . }}
  labels:
    {{- include "rstuf-visualizer.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The trust anchor is not a secret in the usual sense; root metadata is
  # published. It lives here because it decides what this service will
  # believe, so it should be as hard to edit unnoticed as a credential.
  {{ .Values.trustedRoot.key }}: {{ .Values.trustedRoot.value | quote }}
{{- end }}
