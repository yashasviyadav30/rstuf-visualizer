# One command for lint and tests, each in a clean environment:  tox
#
# CI calls the same targets, so a green run here means a green run there.

[tox]
envlist = py3.13,lint,test

[testenv]
# tox takes the value literally, so no quotes: they would end up inside the URL.
setenv =
    RSTUF_METADATA_URL = http://localhost:8080

# Use pipenv to install dependencies
deps = pipenv
commands_pre =
    pipenv install --dev --deploy
    pipenv install --deploy

[testenv:lint]
deps =
    pre-commit
    pipenv
setenv =
    BLACK_CACHE_DIR = ~/.cache/black/
commands =
    pre-commit run flake8 --all-files --show-diff-on-failure
    pre-commit run isort --all-files --show-diff-on-failure
    pre-commit run black --all-files --show-diff-on-failure
    pre-commit run bandit --all-files --show-diff-on-failure

[testenv:test]
commands =
    python -m pytest --cov-report=xml --cov-report=term \
        --cov-config=tox.ini --cov -n auto -vv tests/

[run]
omit = tests/*

[gh-actions]
python =
    3.13: py3.13,lint,test
