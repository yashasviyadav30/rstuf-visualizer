# What the project is called, and the settings pytest reads. Dependencies are
# not here: they live in the Pipfile, the way RSTUF's own services keep them.

[project]
name = "rstuf-visualizer"
version = "0.1.0"
description = "Read-only web view of a TUF repository managed by RSTUF"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"
